version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: cybersecurity_postgres
    environment:
      POSTGRES_DB: cybersecurity
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

# MongoDB removed - using PostgreSQL only

  rag-service:
    build:
      context: ./aiml_part
      dockerfile: Dockerfile
    container_name: rag_service
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=cybersecurity
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - ./aiml_part:/app
      - ./dataset:/app/dataset
      - vector_db_data:/app/cybersecurity_vectordb
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  api-gateway:
    build:
      context: ./API-gateway
      dockerfile: Dockerfile
    container_name: api_gateway
    ports:
      - "9000:9000"
    environment:
      - RAG_SERVICE_URL=http://rag-service:8000
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=cybersecurity
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - ./API-gateway:/app
    depends_on:
      - postgres
      - rag-service
    restart: unless-stopped

volumes:
  postgres_data:
  vector_db_data: