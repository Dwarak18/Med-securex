services:
  # Frontend (Next.js)
  medsecurex-frontend:
    build:
      context: ..
      dockerfile: app/frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
  # ChromaDB Vector Database
  chromadb:
    image: chromadb/chroma:0.4.15
    ports:
      - "8001:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      - ALLOW_RESET=TRUEck
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  # MongoDB Database for logging
  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin123
      - MONGO_INITDB_DATABASE=threat_intelligence
      - MONGO_URL=mongodb://admin:admin123@mongodb:27017/threat_intelligence
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # RAG Service (ML-based payload analysis)
  rag-service:
    build: 
      context: ..
      dockerfile: docker-integration/dockerfiles/Dockerfile.rag
    ports:
      - "8000:8000"
    volumes:
      - ../cybersecurity_vectordb:/app/cybersecurity_vectordb
      - ../app/rag:/app
      - rag_logs:/app/logs
    environment:
      - PYTHONPATH=/app
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - MONGODB_HOST=mongodb
      - MONGODB_PORT=27017
      - MONGODB_USERNAME=admin
      - MONGODB_PASSWORD=admin123
      - MONGODB_DATABASE=threat_intelligence
    depends_on:
      chromadb:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # Security Backend (RAG-integrated security decisions)
  security-backend:
    build:
      context: ..
      dockerfile: docker-integration/dockerfiles/Dockerfile.security
    ports:
      - "9000:9000"
    volumes:
      - security_logs:/app/logs
    environment:
      - RAG_SERVICE_URL=http://rag-service:8000
      - PYTHONPATH=/app
    depends_on:
      - rag-service
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Application Backend (Business logic endpoints)
  app-backend:
    build:
      context: ..
      dockerfile: docker-integration/dockerfiles/Dockerfile.backend
    ports:
      - "9001:9000"
    volumes:
      - app_logs:/app/logs
    environment:
      - PYTHONPATH=/app
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # API Gateway (Entry point with payload inspection)
  api-gateway:
    build:
      context: ..
      dockerfile: docker-integration/dockerfiles/Dockerfile.gateway
    ports:
      - "8081:8081"
    volumes:
      - gateway_logs:/app/logs
      - ../app/backend:/app
    environment:
      - RAG_SERVICE_URL=http://rag-service:8000
      - SECURITY_BACKEND_URL=http://security-backend:9000
      - APP_BACKEND_URL=http://app-backend:9001
      - PYTHONPATH=/app
    depends_on:
      - rag-service
      - security-backend
      - app-backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Nginx Reverse Proxy (Optional - for production)
  nginx:
    build:
      context: ..
      dockerfile: docker-integration/dockerfiles/Dockerfile.nginx
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      - ../app/backend/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - api-gateway
    restart: unless-stopped

volumes:
  chromadb_data:
  mongodb_data:
  mongodb_config:
  rag_logs:
  security_logs:
  app_logs:
  gateway_logs:
  nginx_logs:

networks:
  default:
    driver: bridge