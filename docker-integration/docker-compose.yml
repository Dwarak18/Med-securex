version: '3.8'

services:
  # Note: Qdrant removed - using lightweight vector analysis instead

  # PostgreSQL Database
  postgres:
    image: postgres:15
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - POSTGRES_DB=cybersecurity
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_HOST_AUTH_METHOD=trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cybersecurity"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # RAG Service (AI/ML payload analysis with cyber agents)
  rag-service:
    build: 
      context: ../aiml_part
      dockerfile: ../docker-integration/dockerfiles/Dockerfile.rag
    ports:
      - "8000:8000"
    volumes:
      - ../aiml_part:/app
      - ../datasets:/app/datasets
      - rag_logs:/app/logs
      - models_data:/app/models
    environment:
      - PYTHONPATH=/app
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=cybersecurity
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY:-}
      - SECURITYTRAIL_API_KEY=${SECURITYTRAIL_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - USE_GEMINI=${USE_GEMINI:-false}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/stats || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped



  # API Gateway (Entry point with payload inspection)
  api-gateway:
    build:
      context: ../API-gateway
      dockerfile: ../docker-integration/dockerfiles/Dockerfile.gateway
    ports:
      - "9000:9000"
    volumes:
      - gateway_logs:/app/logs
      - ../API-gateway:/app
    environment:
      - RAG_SERVICE_URL=http://rag-service:8000
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=cybersecurity
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - PYTHONPATH=/app
    depends_on:
      - rag-service
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Nginx Reverse Proxy (Optional - for production)
  nginx:
    build:
      context: ../API-gateway
      dockerfile: ../docker-integration/dockerfiles/Dockerfile.nginx
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      - ../API-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - api-gateway
    restart: unless-stopped

volumes:
  postgres_data:
  rag_logs:
  models_data:
  security_logs:
  app_logs:
  gateway_logs:
  nginx_logs:

networks:
  default:
    driver: bridge